version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: rezebot-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "node", "/app/dist/web/health-check.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: rezebot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: ${PGDATABASE:-rezebot}
      POSTGRES_USER: ${PGUSER:-rezebot}
      POSTGRES_PASSWORD: ${PGPASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${PGUSER:-rezebot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rezebot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: rezebot-worker
    restart: unless-stopped
    command: node dist/workers/scheduler/index.js
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      - app
      - postgres
      - redis

  # Music worker (separate MTProto-based service)
  music-worker:
    image: alpine:latest
    container_name: rezebot-music-worker
    restart: unless-stopped
    environment:
      - TZ=UTC
    entrypoint: ["sh", "-c", "echo 'Music worker requires MTProto service. See docs/music-service.md.' && sleep infinity"]
    depends_on:
      - app

  # Nginx reverse proxy (for webhook + web panel)
  nginx:
    image: nginx:1.27-alpine
    container_name: rezebot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro
    depends_on:
      - app

  # Certbot for SSL
  certbot:
    image: certbot/certbot:latest
    container_name: rezebot-certbot
    restart: unless-stopped
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 2d; done'"
    volumes:
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot

volumes:
  postgres_data:
  redis_data:
